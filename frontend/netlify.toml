[build]
  publish = "dist"
  command = "npm run build"

# Proxy API calls to deployed backend service
[[redirects]]
  from = "/api/*"
  to = "https://cyberguard-backend.onrender.com/api/:splat"
  status = 200
  force = false

# Single-page application route rewrite
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
